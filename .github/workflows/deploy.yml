name: Build and Deploy Microservices

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-1
  AWS_ACCOUNT_ID: "654740195812"
  ECR_REGISTRY: 654740195812.dkr.ecr.us-west-1.amazonaws.com
  EC2_INSTANCE_ID: i-0ea52162ac6397eeb

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose GitHub OIDC claims
        run: |
          python3 - <<'PYTHON'
          import os
          import json
          import urllib.request
          import base64

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          request = urllib.request.Request(
              url,
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]}
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("iss", "aud", "sub", "repository", "ref", "repository_owner"):
              print(f"{key}: {claims.get(key)}")
          PYTHON

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::654740195812:role/GitHubActions-ECR-Push-Role
          aws-region: us-west-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push five microservices
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          for service in api-gateway user-service product-service order-service event-bus; do
            echo "Building $service..."
            docker build -t "$ECR_REGISTRY/$service:$IMAGE_TAG" "./$service"

            echo "Pushing $service..."
            docker push "$ECR_REGISTRY/$service:$IMAGE_TAG"
          done

      - name: Deploy on EC2 using SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          SCRIPT=$(cat <<'SSM_SCRIPT'
          set -euo pipefail

          cd /home/ubuntu/three-microservices-DevOps

          export IMAGE_TAG="__IMAGE_TAG__"

          aws ecr get-login-password --region us-west-1 \
            | docker login --username AWS --password-stdin \
              654740195812.dkr.ecr.us-west-1.amazonaws.com

          docker compose pull
          docker compose up -d

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then
              echo "Deployment and gateway health check successful."
              docker compose ps
              exit 0
            fi
            echo "Waiting for gateway health check..."
            sleep 5
          done

          echo "Gateway health check failed."
          docker compose ps
          docker compose logs --tail=100
          exit 1
          SSM_SCRIPT
          )

          SCRIPT="${SCRIPT//__IMAGE_TAG__/$IMAGE_TAG}"
          PARAMS=$(jq -n --arg script "$SCRIPT" '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Deploy microservices $IMAGE_TAG" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text

              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for SSM deployment."
          exit 1
